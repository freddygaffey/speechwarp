name: Release Rust

# Tests the crate on every platform and checks that the package builds from the tarball cargo would upload
# (cargo publish --dry-run). Nothing is published from a pull request or from main.
#
# Pushing a version tag (git tag v0.3.0 && git push origin v0.3.0) also publishes the crate to crates.io, once
# every test has passed. crates.io trusts this workflow directly ("trusted publishing"), so no token is stored
# here; the trust is set up on crates.io for this repository, this file and the environment `crates-io`. It
# can only be set up once the crate exists, so the first release (0.3.0) is published by hand with
# `cargo publish`. The tag also publishes the other packages (python.yml, js.yml, release-react-native.yml).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - run: cargo test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo package --list
      # Unpacks the crate and builds it on its own, so a C source or licence missing from the package fails here
      # and not on a stranger's machine.
      - run: cargo publish --dry-run

  publish:
    # Only for version tags, and only once the crate has been tested and packaged on every platform.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, package]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write # lets crates.io check that the upload comes from this workflow
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the version being published
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "$GITHUB_REF_NAME" = "v$version" ||
            { echo "Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"; exit 1; }
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # cargo can only publish from the source tree, not from a tarball, so this packages the tagged commit
      # that the jobs above tested.
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
