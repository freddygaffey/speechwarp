name: Rust, Go, Java, Flutter, React Native

# Tests for the bindings that need no packaging step. Nothing is published.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - run: cargo test
      - run: cargo package --list

  go:
    name: go ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./bindings/go ./examples/go
      - run: go test ./bindings/go

  java-natives:
    name: java ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: bindings/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Test
        run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: java-natives-${{ matrix.os }}
          path: bindings/java/build/native-resources/natives

  java-jar:
    name: java jar for every system
    needs: java-natives
    runs-on: macos-latest
    defaults:
      run:
        working-directory: bindings/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          pattern: java-natives-*
          merge-multiple: true
          path: bindings/java/extra-natives/natives
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: java-jar
          path: bindings/java/build/libs/*.jar

  flutter:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build the library for this computer
        run: cmake -B build -DSPEECHWARP_BUILD_TESTS=OFF && cmake --build build
      - name: Dart tests
        working-directory: bindings/flutter
        run: |
          flutter pub get
          flutter analyze
          SPEECHWARP_LIBRARY=$GITHUB_WORKSPACE/build/libspeechwarp.dylib flutter test
      - name: In the real app on macOS
        working-directory: bindings/flutter/example
        run: flutter test integration_test -d macos

  react-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/react-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn prepare
      - run: yarn typecheck
      - run: yarn test
