name: .NET

# Builds the native library for every platform the NuGet package carries, tests the binding on the three
# desktop systems, and leaves the finished package as an artifact. Nothing is published from here.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: native ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64, os: macos-latest }
          - { rid: android-arm64, os: ubuntu-latest }
          - { rid: android-x64, os: ubuntu-latest }
          - { rid: android-arm, os: ubuntu-latest }
          - { rid: win-x64, os: windows-latest, platform: x64 }
          - { rid: win-arm64, os: windows-latest, platform: ARM64 }
    steps:
      - uses: actions/checkout@v4
      - name: Build
        if: runner.os != 'Windows'
        # ANDROID_NDK_LATEST_HOME is set on GitHub's Linux runners.
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" bindings/dotnet/build-native.sh ${{ matrix.rid }}
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -B build -A ${{ matrix.platform }} -DSPEECHWARP_BUILD_STATIC=OFF -DSPEECHWARP_BUILD_TESTS=OFF -DSPEECHWARP_BUILD_TOOLS=OFF
          cmake --build build --config Release
          mkdir -p bindings/dotnet/Speechwarp/runtimes/${{ matrix.rid }}/native
          cp build/Release/speechwarp.dll bindings/dotnet/Speechwarp/runtimes/${{ matrix.rid }}/native/
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: bindings/dotnet/Speechwarp/runtimes
          if-no-files-found: error

  test:
    name: test ${{ matrix.os }}
    needs: native
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: bindings/dotnet/Speechwarp/runtimes
      - name: Test
        working-directory: bindings/dotnet
        run: dotnet test --project Speechwarp.Tests

  pack:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: bindings/dotnet/Speechwarp/runtimes
      - name: Pack
        run: dotnet pack bindings/dotnet/Speechwarp -c Release -o package
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: package/*.nupkg
