# The Python package speechwarp-listen: speech to text with whisper.cpp. It is separate from the speechwarp package
# because it is large (it carries whisper.cpp) and needs a model file. The library is built with CMake from listen/
# and loaded with ctypes, so one wheel per platform serves every Python 3 version.
#
# It builds from a clone with the whisper.cpp submodule checked out, or from a source distribution, which carries
# the sources it needs (vendor.py copies them in before `python -m build --sdist`).
[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "speechwarp-listen"
# Keep in step with SPEECHWARP_VERSION in include/speechwarp.h (tools/bump-version.sh does); the tests check it.
version = "0.3.7"
description = "Speech to text on the device with whisper.cpp: a sentence, a whole audiobook or a microphone, with word times"
readme = "README.md"
license = "Apache-2.0 AND MIT"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]
keywords = ["speech", "speech-to-text", "transcription", "whisper", "whisper.cpp", "subtitles", "audiobook"]
classifiers = [
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.urls]
Homepage = "https://github.com/fredgaffey/speechwarp"

[project.optional-dependencies]
test = ["pytest"]

[tool.scikit-build]
minimum-version = "build-system.requires"
# ctypes, not the Python C API: the wheel is tagged py3-none-<platform>.
wheel.py-api = "py3"
wheel.packages = ["speechwarp_listen"]
cmake.build-type = "Release"
# The sources a source distribution needs (see vendor.py); a clone uses the repository's own.
sdist.include = ["vendor/**"]
sdist.exclude = ["build", "dist", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
# One build per platform: the wheel does not depend on the Python version.
build = "cp312-*"
skip = "*-musllinux_* *-manylinux_i686 *-win32"
test-extras = ["test"]
test-command = "pytest {package}/tests"

[tool.cibuildwheel.macos]
# whisper.cpp's use of Accelerate and Metal needs macOS 13.3 (see CMakeLists.txt).
environment = { MACOSX_DEPLOYMENT_TARGET = "13.3" }
